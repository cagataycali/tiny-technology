# Separate foundry root from chain/ on purpose: chain/ builds the LIVE 8469's
# TinyUSDC, and a shared out-dir would let a multinode build overwrite artifacts
# the production deploy path reads.
[profile.default]
src = "contracts"
out = "artifacts"
cache_path = "cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
