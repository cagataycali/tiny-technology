site_name: tiny.technology
site_url: https://cagataycali.github.io/tiny-technology/
site_description: "Create your own AI by chatting. A durable AI entity with a name, a memory, a body across your devices, a social life, and a wallet."
repo_url: https://github.com/cagataycali/tiny-technology
repo_name: cagataycali/tiny-technology

# PUBLISHING CONVENTION — root-level docs/*.md are working notes; public site
# pages live in subdirectories (developers/, ...). index.md is the one exception.
#
# ⚠️ CONCEPTS.md is deliberately NOT published here. It is the README's companion
# ("every claim traced to the code that implements it") and it is written to be
# read ON GitHub, next to the source it cites — a reader following those file
# links wants the repo, not a styled page. The site answers "why does this
# exist"; the repo answers "is it real". Keep them pointed at each other rather
# than duplicating one inside the other.
exclude_docs: |
  /*.md
  !/index.md
  # The share cards' copy, for the checker that compares them with the pages
  # (scripts/gen-og-cards.mjs) — a build input, not a page asset.
  /assets/og/manifest.json

extra_css:
  - stylesheets/extra.css
  - stylesheets/landing.css
  # The 3D/AR pendant on platform/devices.md. Class-scoped under .viewer, so a
  # global stylesheet costs the other 20 pages nothing but a few hundred bytes —
  # unlike its 956 KB runtime, which is loaded from that page's own markup and
  # deliberately NOT from extra_javascript below.
  - stylesheets/viewer.css

# The mark on the landing page is a physics object, not an animation: seven peers
# that pour when you tilt the phone. See the header of the file for why iOS makes
# that ~300 lines instead of a CSS keyframe.
extra_javascript:
  - js/tiny-drop.js

copyright: "tiny.technology — we're a software, together. 🤝"

extra:
  social:
    - icon: material/web
      link: https://tiny.technology
      name: tiny.technology
    - icon: fontawesome/brands/github
      link: https://github.com/cagataycali/tiny-technology
      name: cagataycali/tiny-technology on GitHub
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/tiny-tech
      name: tiny-tech on npm

# NAV ORDER IS THE ARGUMENT, and it is ordered for the reader who arrives
# knowing nothing: what it is (Home) → try it (Start here) → what it can
# actually do (Platform) → why it exists and how it earns (Business) → see it
# (Gallery) → run it yourself (Developers) → the objections (FAQ).
#
# Gallery sits ABOVE Developers on purpose: a reporter or an investor reaches
# the films and diagrams without first walking past a terminal prompt, and a
# developer loses nothing by scrolling one section further.
nav:
  - Home: index.md
  - Start here:
      - Quickstart: getting-started/quickstart.md
      - What would you build?: getting-started/what-to-build.md
  - Platform:
      - Memory: platform/memory.md
      - Skills & tools: platform/skills.md
      - Devices & senses: platform/devices.md
      - Automation: platform/automation.md
      - The universe: platform/universe.md
  - Business:
      - Overview: business/index.md
      - How tiny is different: business/comparison.md
      - Pricing & economics: business/pricing.md
      - Build a tiny: business/build-guide.md
      - Integrate a tiny: business/integrate.md
      - tiny for teams: business/enterprise.md
      - Trust & sovereignty: business/trust.md
      - Roadmap: business/roadmap.md
  - Gallery: gallery/index.md
  - Developers:
      - Overview: developers/index.md
      - Enroll a device: developers/enroll-a-device.md
      - Run a tiny node: developers/run-a-node.md
  - FAQ: faq/index.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - navigation.top
    - navigation.tracking
    - content.tabs.link
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  # Without this, `:material-arrow-right:` renders as that literal text rather
  # than an inline SVG — every icon shortcode on the site depends on it.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true

plugins:
  - search
