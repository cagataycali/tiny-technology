<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Mert Özbaş Founder OS mark</title>
  <desc id="desc">An original animated MÖ monogram surrounded by agent and robotics orbits.</desc>

  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160923"/>
      <stop offset="1" stop-color="#031218"/>
    </linearGradient>
    <linearGradient id="markStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset=".52" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="markAura">
      <stop offset="0" stop-color="#A855F7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="markGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ring-a { animation: ringA 14s linear infinite; transform-origin: 120px 120px; }
      .ring-b { animation: ringB 9s linear infinite; transform-origin: 120px 120px; }
      .mark-pulse { animation: markPulse 3.2s ease-in-out infinite; transform-origin: 120px 120px; }
      .node { animation: nodePulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node-late { animation: nodePulse 2.4s 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ringA { to { transform: rotate(360deg); } }
      @keyframes ringB { to { transform: rotate(-360deg); } }
      @keyframes markPulse {
        0%, 100% { opacity: .82; transform: scale(.985); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: .5; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .mark-pulse, .node, .node-late { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="240" height="240" rx="56" fill="url(#markBg)"/>
  <circle cx="120" cy="120" r="112" fill="url(#markAura)"/>
  <path d="M18 75L75 18H165L222 75V165L165 222H75L18 165Z" fill="none" stroke="#F8FAFC" stroke-opacity=".08"/>

  <g class="ring-a">
    <circle cx="120" cy="120" r="91" fill="none" stroke="#A855F7" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 12"/>
    <circle cx="211" cy="120" r="5.5" fill="#A855F7" filter="url(#markGlow)"/>
  </g>
  <g class="ring-b">
    <ellipse cx="120" cy="120" rx="101" ry="62" fill="none" stroke="#22D3EE" stroke-opacity=".38" stroke-width="2" stroke-dasharray="25 10 3 10"/>
    <circle cx="19" cy="120" r="4.5" fill="#22D3EE" filter="url(#markGlow)"/>
  </g>

  <g class="mark-pulse">
    <circle cx="120" cy="120" r="70" fill="#05030A" stroke="url(#markStroke)" stroke-width="3" filter="url(#markGlow)"/>
    <!-- M: founder intent and execution paths converge -->
    <path d="M61 157V84L86 116L111 84V157" fill="none" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ö: verified data loop -->
    <circle cx="156" cy="121" r="31" fill="none" stroke="#22D3EE" stroke-width="10"/>
    <circle cx="144" cy="76" r="5" fill="#22D3EE" class="node"/>
    <circle cx="168" cy="76" r="5" fill="#A855F7" class="node-late"/>
    <path d="M120 184H166" stroke="#F8FAFC" stroke-opacity=".24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="184" r="4" fill="#A855F7"/>
    <circle cx="166" cy="184" r="4" fill="#22D3EE"/>
  </g>

  <circle cx="120" cy="120" r="4.5" fill="#F8FAFC" class="node" filter="url(#markGlow)"/>
</svg>
