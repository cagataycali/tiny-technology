<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="cagatay">
  <!-- cagatay ./c² — "Hack the (things || ideas) with code." A terminal prompt ./c² with a
       blinking cursor, neon-green on black. Builder energy. -->
  <defs>
    <radialGradient id="c-g" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="#050805"/>
  <rect width="120" height="120" rx="26" fill="url(#c-g)"/>
  <!-- ./c² wordmark -->
  <text x="18" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="34" font-weight="700" fill="#00FF88">./c</text>
  <text x="79" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700" fill="#7dffc0">2</text>
  <!-- blinking cursor -->
  <rect x="92" y="50" width="13" height="24" fill="#00FF88">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" keyTimes="0;0.5;0.5;1" repeatCount="indefinite"/>
  </rect>
</svg>
