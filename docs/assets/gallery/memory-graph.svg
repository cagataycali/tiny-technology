<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00FF88"/>
    </marker>
    <marker id="mgd" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7CFFC4"/>
    </marker>
    <radialGradient id="node" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7CFFC4"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </radialGradient>
    <style>
      .box{fill:#06160E;stroke:#00FF8855;stroke-width:1.5}
      .lbl{fill:#E8FFF3;font-size:15px;font-weight:600}
      .sub{fill:#9FDFC0;font-size:11px}
      .edge{stroke:#00FF8866;stroke-width:1.5;fill:none}
      .rev{stroke:#7CFFC4;stroke-width:2;fill:none;stroke-dasharray:6 6}
      .stale{fill:#3f6f57;font-size:11px;text-decoration:line-through}
      .warn{fill:#FF4D4D;font-size:12px;font-weight:600}
    </style>
  </defs>
  <rect width="920" height="360" fill="#020604"/>
  <text x="460" y="34" text-anchor="middle" class="lbl" font-size="18">Memory — a bitemporal knowledge graph</text>
  <text x="460" y="54" text-anchor="middle" class="sub">facts connect, get revised (not overwritten), and flag their own contradictions</text>

  <!-- entity node -->
  <g>
    <circle cx="150" cy="190" r="34" fill="url(#node)"/>
    <text x="150" y="195" text-anchor="middle" fill="#020604" font-size="13" font-weight="700">you</text>
  </g>

  <!-- fact nodes -->
  <g><rect class="box" x="360" y="86" width="200" height="58" rx="12"/>
    <text x="460" y="110" text-anchor="middle" class="lbl">works at Acme</text>
    <text x="460" y="130" text-anchor="middle" class="stale">valid until 2026-05</text></g>

  <g><rect class="box" x="360" y="166" width="200" height="58" rx="12" stroke="#00FF88" stroke-width="2"/>
    <text x="460" y="190" text-anchor="middle" class="lbl">works at Globex</text>
    <text x="460" y="210" text-anchor="middle" class="sub">valid from 2026-05 · current</text></g>

  <g><rect class="box" x="360" y="246" width="200" height="58" rx="12"/>
    <text x="460" y="270" text-anchor="middle" class="lbl">prefers dark mode</text>
    <text x="460" y="290" text-anchor="middle" class="sub">observed · 3 sources</text></g>

  <!-- edges entity -> facts -->
  <path class="edge" d="M184,178 Q280,150 360,120" marker-end="url(#mg)"/>
  <path class="edge" d="M184,190 Q280,190 360,195" marker-end="url(#mg)"/>
  <path class="edge" d="M184,202 Q280,240 360,272" marker-end="url(#mg)"/>

  <!-- revision arrow: old superseded by new -->
  <path class="rev" d="M560,120 Q640,145 560,180" marker-end="url(#mgd)">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <text x="648" y="150" text-anchor="middle" class="sub">supersedes</text>
  <text x="648" y="166" text-anchor="middle" class="sub">— history kept</text>

  <!-- conflict flag -->
  <g><rect class="box" x="690" y="238" width="190" height="74" rx="12" stroke="#FF4D4D66"/>
    <text x="785" y="262" text-anchor="middle" class="warn">⚠ conflict detected</text>
    <text x="785" y="282" text-anchor="middle" class="sub">two sources disagree</text>
    <text x="785" y="298" text-anchor="middle" class="sub">surfaced for you to resolve</text></g>
  <path class="edge" d="M560,278 L688,275" marker-end="url(#mg)" stroke="#FF4D4D66"/>

  <!-- traveling pulse along current-fact edge -->
  <circle r="5" fill="url(#node)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M184,190 Q280,190 360,195"/>
  </circle>

  <text x="460" y="344" text-anchor="middle" fill="#3f6f57" font-size="12">valid-time × transaction-time · syncs across every device · never a blank context window</text>
</svg>
