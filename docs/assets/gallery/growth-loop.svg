<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="gl-fw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00FF88"/>
    </marker>
    <radialGradient id="gl-core" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7CFFC4"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </radialGradient>
    <style>
      .gl-lbl{fill:#E8FFF3;font-size:13px;font-weight:700}
      .gl-sub{fill:#9FDFC0;font-size:10px}
      .gl-node{fill:#06160E;stroke:#00FF88;stroke-width:1.6}
      .gl-step{fill:#7CFFC4;font-size:11px;font-weight:800;letter-spacing:0.05em}
      .gl-name{fill:#E8FFF3;font-size:13px;font-weight:700}
      .gl-desc{fill:#CFEFDD;font-size:10px}
      .gl-ring{fill:none;stroke:#00FF8830;stroke-width:1.4;stroke-dasharray:5 7}
    </style>
  </defs>
  <rect width="920" height="520" fill="#020604"/>
  <text x="460" y="30" text-anchor="middle" class="gl-lbl" font-size="18">The URL is the funnel — growth is embedded in usage</text>
  <text x="460" y="49" text-anchor="middle" class="gl-sub">every shared tiny is its own landing page and replayable demo, so each use seeds the next creator — no paid acquisition, CAC trends to zero</text>

  <!-- the compounding loop ring -->
  <circle cx="460" cy="290" r="176" class="gl-ring"/>
  <!-- travelling pulse around the loop -->
  <circle r="5" fill="url(#gl-core)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M460,114 A176,176 0 1,1 459,114"/>
  </circle>

  <!-- forward arcs between the 5 stations (clockwise) -->
  <path d="M556,148 A176,176 0 0,1 628,258" fill="none" stroke="#00FF8855" stroke-width="1.6" marker-end="url(#gl-fw)"/>
  <path d="M634,320 A176,176 0 0,1 548,420" fill="none" stroke="#00FF8855" stroke-width="1.6" marker-end="url(#gl-fw)"/>
  <path d="M470,466 A176,176 0 0,1 350,432" fill="none" stroke="#00FF8855" stroke-width="1.6" marker-end="url(#gl-fw)"/>
  <path d="M292,388 A176,176 0 0,1 288,238" fill="none" stroke="#00FF8855" stroke-width="1.6" marker-end="url(#gl-fw)"/>
  <path d="M312,168 A176,176 0 0,1 420,116" fill="none" stroke="#00FF8855" stroke-width="1.6" marker-end="url(#gl-fw)"/>

  <!-- STATION 1 — top: create by chatting -->
  <g>
    <rect class="gl-node" x="378" y="80" width="164" height="72" rx="12"/>
    <text x="392" y="102" class="gl-step">1 · CREATE</text>
    <text x="392" y="120" class="gl-name">chat it into being</text>
    <text x="392" y="136" class="gl-desc">live at tiny.technology/name</text>
    <text x="392" y="149" class="gl-desc">— no code, no store, no server</text>
  </g>

  <!-- STATION 2 — right: share the URL -->
  <g>
    <rect class="gl-node" x="612" y="228" width="176" height="72" rx="12"/>
    <text x="626" y="250" class="gl-step">2 · SHARE</text>
    <text x="626" y="268" class="gl-name">the URL is a landing page</text>
    <text x="626" y="284" class="gl-desc">OG player card unfurls in chat,</text>
    <text x="626" y="297" class="gl-desc">an installable PWA, a vCard</text>
  </g>

  <!-- STATION 3 — bottom-right: someone chats / replays -->
  <g>
    <rect class="gl-node" x="512" y="416" width="176" height="72" rx="12"/>
    <text x="526" y="438" class="gl-step">3 · A STRANGER TRIES IT</text>
    <text x="526" y="456" class="gl-name">chats it · replays a share</text>
    <text x="526" y="472" class="gl-desc">every conversation share is a</text>
    <text x="526" y="485" class="gl-desc">working, replayable demo</text>
  </g>

  <!-- STATION 4 — bottom-left: they create their own -->
  <g>
    <rect class="gl-node" x="232" y="416" width="176" height="72" rx="12"/>
    <text x="246" y="438" class="gl-step">4 · THEY CREATE THEIRS</text>
    <text x="246" y="456" class="gl-name">"I want one too"</text>
    <text x="246" y="472" class="gl-desc">the meta-agent hands them</text>
    <text x="246" y="485" class="gl-desc">their own tiny.technology/name</text>
  </g>

  <!-- STATION 5 — left: discovery amplifies -->
  <g>
    <rect class="gl-node" x="132" y="228" width="176" height="72" rx="12"/>
    <text x="146" y="250" class="gl-step">5 · DISCOVERY AMPLIFIES</text>
    <text x="146" y="268" class="gl-name">RAG universe · MCP · x402</text>
    <text x="146" y="284" class="gl-desc">humans search, agents crawl</text>
    <text x="146" y="297" class="gl-desc">ERC-8004 — more reach, free</text>
  </g>

  <!-- center: the compounding payoff -->
  <g>
    <circle cx="460" cy="290" r="60" fill="url(#gl-core)" opacity="0.92">
      <animate attributeName="r" values="56;64;56" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="460" y="282" text-anchor="middle" fill="#020604" font-size="14" font-weight="800">every use</text>
    <text x="460" y="300" text-anchor="middle" fill="#020604" font-size="14" font-weight="800">seeds a</text>
    <text x="460" y="318" text-anchor="middle" fill="#053" font-size="12" font-weight="700">new creator</text>
  </g>

  <text x="460" y="510" text-anchor="middle" fill="#3f6f57" font-size="11">Three seeds feed the loop: creator seeding (price 100 experts), the developer surface (npx tiny-tech in Claude/Cursor), and agent-economy indexing (ERC-8004/x402 discovery, no human marketing).</text>
</svg>
