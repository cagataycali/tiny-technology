<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="mf-fw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00FF88"/>
    </marker>
    <radialGradient id="mf-orb" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7CFFC4"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </radialGradient>
    <style>
      .mf-box{fill:#06160E;stroke:#00FF8855;stroke-width:1.5}
      .mf-lbl{fill:#E8FFF3;font-size:14px;font-weight:700}
      .mf-sub{fill:#9FDFC0;font-size:10.5px}
      .mf-num{fill:#7CFFC4;font-size:12px;font-weight:800;font-family:ui-monospace,Menlo,monospace}
      .mf-ring{stroke:#00FF88;stroke-width:2;fill:none}
      .mf-moat{fill:#00FF88;font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect width="920" height="520" fill="#020604"/>
  <text x="460" y="34" text-anchor="middle" class="mf-lbl" font-size="19">The moat is a flywheel — every turn makes tiny harder to leave</text>
  <text x="460" y="54" text-anchor="middle" class="mf-sub">memories, follows, consults, and ledger history are joint state a competitor's crawler can't export; it compounds the longer you use it</text>

  <!-- The rotating flywheel: a dashed circle the pulse travels, four stages around it -->
  <circle cx="460" cy="300" r="150" fill="none" stroke="#00FF8833" stroke-width="1.4" stroke-dasharray="7 7"/>
  <!-- travelling pulse riding the ring clockwise -->
  <circle r="5" fill="url(#mf-orb)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto"
      path="M460,150 A150,150 0 1,1 459.9,150 Z"/>
  </circle>

  <!-- centre hub -->
  <circle cx="460" cy="300" r="58" fill="url(#mf-orb)">
    <animate attributeName="r" values="54;62;54" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="460" y="294" text-anchor="middle" font-size="13" font-weight="800" fill="#020604">joint</text>
  <text x="460" y="311" text-anchor="middle" font-size="13" font-weight="800" fill="#020604">social-econ</text>
  <text x="460" y="327" text-anchor="middle" font-size="11" font-weight="700" fill="#053">graph</text>

  <!-- Stage 1 (top) — usage -->
  <g>
    <rect class="mf-box" x="360" y="120" width="200" height="60" rx="12"/>
    <text x="376" y="144" class="mf-num">1 · more usage</text>
    <text x="376" y="163" class="mf-sub">chats, jobs, voice calls, tool</text>
    <text x="376" y="176" class="mf-sub">installs, consults, payments</text>
  </g>
  <!-- Stage 2 (right) — deeper state -->
  <g>
    <rect class="mf-box" x="640" y="255" width="230" height="90" rx="12"/>
    <text x="658" y="279" class="mf-num">2 · deeper joint state</text>
    <text x="658" y="299" class="mf-sub">bitemporal memory grows · follow</text>
    <text x="658" y="314" class="mf-sub">edges · trust-PageRank consults ·</text>
    <text x="658" y="329" class="mf-sub">append-only USDC ledger history</text>
  </g>
  <!-- Stage 3 (bottom) — switching cost + network value -->
  <g>
    <rect class="mf-box" x="345" y="418" width="230" height="82" rx="12"/>
    <text x="361" y="442" class="mf-num">3 · defensibility rises</text>
    <text x="361" y="462" class="mf-sub">switching cost climbs (state can't</text>
    <text x="361" y="477" class="mf-sub">be crawled out) &amp; the network is</text>
    <text x="361" y="492" class="mf-sub">worth more to the next joiner</text>
  </g>
  <!-- Stage 4 (left) — attracts more -->
  <g>
    <rect class="mf-box" x="50" y="255" width="220" height="90" rx="12"/>
    <text x="66" y="279" class="mf-num">4 · attracts more</text>
    <text x="66" y="299" class="mf-sub">creators price expertise, agents</text>
    <text x="66" y="314" class="mf-sub">find priced tinys via x402/ERC-8004,</text>
    <text x="66" y="329" class="mf-sub">users bring their people → back to 1</text>
  </g>

  <!-- curved arrows between stages, following the ring clockwise -->
  <path class="mf-ring" d="M556,155 A150,150 0 0,1 604,255" marker-end="url(#mf-fw)"/>
  <path class="mf-ring" d="M600,352 A150,150 0 0,1 470,449" marker-end="url(#mf-fw)"/>
  <path class="mf-ring" d="M352,442 A150,150 0 0,1 258,352" marker-end="url(#mf-fw)"/>
  <path class="mf-ring" d="M270,255 A150,150 0 0,1 362,155" marker-end="url(#mf-fw)"/>

  <!-- the four named moats, small tags in the corners -->
  <text x="40" y="120" class="mf-moat">◆ un-crawlable graph</text>
  <text x="700" y="120" text-anchor="end" class="mf-moat">◆ embodiment breadth ×6</text>
  <text x="40" y="512" class="mf-moat" font-size="10.5" fill="#3f6f57">◆ sovereign distribution — no platform can switch tiny off</text>
  <text x="880" y="512" text-anchor="end" class="mf-moat" font-size="10.5" fill="#3f6f57">◆ protocol position — first-mover x402 payer+payee · ERC-8004</text>
</svg>
