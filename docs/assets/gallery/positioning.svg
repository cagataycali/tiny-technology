<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <radialGradient id="ps-tiny" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7CFFC4"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </radialGradient>
    <marker id="ps-ax" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9FDFC0"/>
    </marker>
    <style>
      .ps-lbl{fill:#E8FFF3;font-size:14px;font-weight:600}
      .ps-sub{fill:#9FDFC0;font-size:10.5px}
      .ps-axis{stroke:#9FDFC0;stroke-width:1.5}
      .ps-ax-lbl{fill:#9FDFC0;font-size:12px;font-weight:600}
      .ps-quad{fill:#7CFFC4;font-size:10px;opacity:0.5}
      .ps-comp{fill:#0d3626;stroke:#00FF8844;stroke-width:1.3}
      .ps-comp-lbl{fill:#9FDFC0;font-size:12px;font-weight:600}
      .ps-tiny-lbl{fill:#020604;font-size:15px;font-weight:800}
    </style>
  </defs>
  <rect width="920" height="560" fill="#020604"/>
  <text x="460" y="34" text-anchor="middle" class="ps-lbl" font-size="18">Where tiny sits — a smarter session vs. a durable entity you own</text>
  <text x="460" y="53" text-anchor="middle" class="ps-sub">everyone else gives you a smarter session; tiny gives your AI a life — and you keep the keys</text>

  <!-- plot bounds: x 120..820, y 90..500 -->
  <!-- quadrant fills -->
  <rect x="470" y="90" width="350" height="205" fill="#00FF88" opacity="0.05"/>

  <!-- axes (cross through the middle) -->
  <line class="ps-axis" x1="120" y1="500" x2="820" y2="500" marker-end="url(#ps-ax)"/>
  <line class="ps-axis" x1="120" y1="500" x2="120" y2="90" marker-end="url(#ps-ax)"/>

  <!-- x-axis labels -->
  <text x="150" y="524" class="ps-ax-lbl">a smarter session</text>
  <text x="690" y="524" class="ps-ax-lbl">a durable entity</text>
  <text x="470" y="540" text-anchor="middle" class="ps-sub">persistence · identity · embodiment · economy  →</text>
  <!-- y-axis labels -->
  <text x="112" y="486" text-anchor="end" class="ps-ax-lbl" transform="rotate(-90 112 486)">platform-gated</text>
  <text x="112" y="120" text-anchor="end" class="ps-ax-lbl" transform="rotate(-90 112 120)">sovereign · open</text>

  <!-- quadrant hint -->
  <text x="800" y="108" text-anchor="end" class="ps-quad">own it · run it · exit it</text>

  <!-- competitors (lower / left cluster) -->
  <!-- Custom GPTs: gated, some persistence -->
  <g><circle class="ps-comp" cx="330" cy="430" r="26"/>
    <text x="330" y="472" text-anchor="middle" class="ps-comp-lbl">Custom GPTs</text>
    <text x="330" y="486" text-anchor="middle" class="ps-sub">store-gated · per-GPT</text></g>
  <!-- Character.AI: entity-ish per character, gated -->
  <g><circle class="ps-comp" cx="470" cy="390" r="26"/>
    <text x="470" y="352" text-anchor="middle" class="ps-comp-lbl">Character.AI</text>
    <text x="470" y="366" text-anchor="middle" class="ps-sub">per-character · closed</text></g>
  <!-- Poe -->
  <g><circle class="ps-comp" cx="250" cy="360" r="24"/>
    <text x="250" y="330" text-anchor="middle" class="ps-comp-lbl">Poe bots</text>
    <text x="250" y="344" text-anchor="middle" class="ps-sub">rev-share · closed</text></g>
  <!-- raw chatbot -->
  <g><circle class="ps-comp" cx="190" cy="455" r="22"/>
    <text x="190" y="428" text-anchor="middle" class="ps-comp-lbl">Raw chatbot</text></g>

  <!-- tiny: top-right, breathing -->
  <g>
    <circle cx="660" cy="180" r="62" fill="none" stroke="#00FF8833" stroke-width="1.5">
      <animate attributeName="r" values="58;68;58" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="180" r="46" fill="url(#ps-tiny)">
      <animate attributeName="r" values="44;50;44" dur="3.2s" repeatCount="indefinite"/></circle>
    <text x="660" y="176" text-anchor="middle" class="ps-tiny-lbl">tiny</text>
    <text x="660" y="192" text-anchor="middle" fill="#053" font-size="9.5" font-weight="700">you own it</text>
  </g>
  <text x="660" y="262" text-anchor="middle" class="ps-sub">URL · memory · body · society · economy — BYOK, on-device, open, no store gate</text>

  <!-- the empty-quadrant callout -->
  <text x="600" y="300" text-anchor="middle" fill="#3f6f57" font-size="11" font-style="italic">the top-right is empty until you build an entity you actually own</text>
</svg>
