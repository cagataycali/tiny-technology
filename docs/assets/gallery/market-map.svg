<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="mm-mk" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00FF88"/>
    </marker>
    <radialGradient id="mm-core" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7CFFC4"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </radialGradient>
    <style>
      .mm-title{fill:#E8FFF3;font-size:18px;font-weight:700}
      .mm-sub{fill:#9FDFC0;font-size:11px}
      .mm-box{fill:#06160E;stroke:#00FF8855;stroke-width:1.5}
      .mm-seg{fill:#7CFFC4;font-size:13px;font-weight:800;letter-spacing:0.03em}
      .mm-val{fill:#E8FFF3;font-size:11px;font-weight:600}
      .mm-desc{fill:#CFEFDD;font-size:10px}
      .mm-mono{fill:#7CFFC4;font-size:9px;font-family:ui-monospace,Menlo,monospace}
      .mm-band{fill:none;stroke:#00FF8822;stroke-width:1.2;stroke-dasharray:4 6}
      .mm-flow{stroke:#00FF88;stroke-width:1.6;fill:none;stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="920" height="520" fill="#020604"/>
  <text x="460" y="30" text-anchor="middle" class="mm-title">Who tiny is for — four segments, one entity</text>
  <text x="460" y="49" text-anchor="middle" class="mm-sub">the same tiny you own is a different product to each buyer — consumer, creator, developer, agent — and each has its own way in and its own way to pay</text>

  <!-- concentric adoption bands radiating from the shared core -->
  <circle cx="150" cy="292" r="120" class="mm-band"/>
  <circle cx="150" cy="292" r="210" class="mm-band"/>
  <circle cx="150" cy="292" r="300" class="mm-band"/>

  <!-- shared entity core (bottom-left origin) -->
  <g>
    <circle cx="150" cy="292" r="54" fill="url(#mm-core)" opacity="0.92">
      <animate attributeName="r" values="50;58;50" dur="3.4s" repeatCount="indefinite"/></circle>
    <text x="150" y="286" text-anchor="middle" fill="#020604" font-size="14" font-weight="800">one tiny</text>
    <text x="150" y="303" text-anchor="middle" fill="#020604" font-size="12" font-weight="700">you own</text>
    <text x="150" y="319" text-anchor="middle" fill="#053" font-size="9" font-weight="600">five attributes</text>
  </g>

  <!-- SEGMENT 1 — Consumers -->
  <g>
    <rect class="mm-box" x="392" y="72" width="300" height="86" rx="13"/>
    <text x="408" y="95" class="mm-seg">① CONSUMERS</text>
    <text x="620" y="95" text-anchor="end" class="mm-mono">"my AI", not "an AI"</text>
    <text x="408" y="115" class="mm-val">the personalization end-state of the assistant market</text>
    <text x="408" y="132" class="mm-desc">everyone who wants an AI that remembers them, lives on</text>
    <text x="408" y="146" class="mm-desc">their devices, and is theirs — free to create, kept alive by use</text>
  </g>

  <!-- SEGMENT 2 — Creators / prosumers -->
  <g>
    <rect class="mm-box" x="392" y="170" width="300" height="86" rx="13"/>
    <text x="408" y="193" class="mm-seg">② CREATORS · prosumers</text>
    <text x="676" y="193" text-anchor="end" class="mm-mono">price per message</text>
    <text x="408" y="213" class="mm-val">the Gumroad / Substack analog for AI expertise</text>
    <text x="408" y="230" class="mm-desc">package what you know into a priced tiny; audiences arrive</text>
    <text x="408" y="244" class="mm-desc">via links, reputation compounds through the consult graph</text>
  </g>

  <!-- SEGMENT 3 — Developers -->
  <g>
    <rect class="mm-box" x="392" y="268" width="300" height="86" rx="13"/>
    <text x="408" y="291" class="mm-seg">③ DEVELOPERS</text>
    <text x="676" y="291" text-anchor="end" class="mm-mono">npx tiny-tech · MCP</text>
    <text x="408" y="311" class="mm-val">OpenAPI / MCP users who want distribution</text>
    <text x="408" y="328" class="mm-desc">publish a skill once, reach every tiny; mount identity,</text>
    <text x="408" y="342" class="mm-desc">memory &amp; tools into Claude / Cursor where you already live</text>
  </g>

  <!-- SEGMENT 4 — Agent operators -->
  <g>
    <rect class="mm-box" x="392" y="366" width="300" height="86" rx="13"/>
    <text x="408" y="389" class="mm-seg">④ AGENT OPERATORS</text>
    <text x="676" y="389" text-anchor="end" class="mm-mono">x402 · ERC-8004</text>
    <text x="408" y="409" class="mm-val">autonomous agents that need counterparties  <tspan fill="#7CFFC4">(emerging)</tspan></text>
    <text x="408" y="426" class="mm-desc">tiny's x402 endpoints are Bazaar-crawlable today — agents</text>
    <text x="408" y="440" class="mm-desc">discover and pay priced tinys with no human in the loop</text>
  </g>

  <!-- core → segment connectors with travelling pulses -->
  <path class="mm-flow" d="M198,262 C300,150 340,120 390,115" marker-end="url(#mm-mk)"/>
  <path class="mm-flow" d="M204,285 C300,240 340,214 390,213" marker-end="url(#mm-mk)"/>
  <path class="mm-flow" d="M204,299 C300,300 340,311 390,311" marker-end="url(#mm-mk)"/>
  <path class="mm-flow" d="M198,322 C300,420 340,404 390,409" marker-end="url(#mm-mk)"/>
  <circle r="4" fill="url(#mm-core)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M198,262 C300,150 340,120 390,115"/></circle>
  <circle r="4" fill="url(#mm-core)"><animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite" path="M204,285 C300,240 340,214 390,213"/></circle>
  <circle r="4" fill="url(#mm-core)"><animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite" path="M204,299 C300,300 340,311 390,311"/></circle>
  <circle r="4" fill="url(#mm-core)"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" path="M198,322 C300,420 340,404 390,409"/></circle>

  <text x="460" y="484" text-anchor="middle" class="mm-mono">consumers adopt · creators monetize · developers distribute · agents transact — the same platform, four expanding rings</text>
  <text x="460" y="506" text-anchor="middle" fill="#3f6f57" font-size="10.5">Revenue scales with the agent economy's volume, not our inference cost: a flat platform fee per paid invocation, a creator take-rate, and marketplace tool sales.</text>
</svg>
