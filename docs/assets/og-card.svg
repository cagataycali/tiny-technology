<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="tiny — create your own AI by chatting">
  <!-- Social/OG card for the docs site. Motif borrowed from public/logo.svg
       (the living neon node with orbiting tinys). Render to PNG with:
       rsvg-convert -w 1200 -h 630 docs/assets/og-card.svg -o docs/assets/og-card.png -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#00FF88" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ebfff5"/>
      <stop offset="45%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00b460"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#020604"/>
  <!-- the node, right of center -->
  <g transform="translate(880,315)">
    <circle r="190" fill="url(#glow)"/>
    <circle cx="0" cy="-160" r="16" fill="#00FF88"/>
    <circle cx="160" cy="0" r="12" fill="#00FF88" opacity="0.8"/>
    <circle cx="-40" cy="150" r="14" fill="#7dffc2"/>
    <circle cx="-140" cy="-70" r="10" fill="#00FF88" opacity="0.7"/>
    <circle cx="120" cy="115" r="10" fill="#00FF88" opacity="0.7"/>
    <circle r="62" fill="url(#core)"/>
  </g>
  <!-- wordmark + tagline -->
  <g fill="#ebfff5" font-family="Helvetica, Arial, sans-serif">
    <text x="90" y="300" font-size="120" font-weight="bold">tiny</text>
    <text x="90" y="370" font-size="42" fill="#00FF88">create your own AI by chatting</text>
    <text x="90" y="440" font-size="30" fill="#7dffc2" opacity="0.85">memory · body · society · economy</text>
    <text x="90" y="540" font-size="28" opacity="0.65">tiny.technology</text>
  </g>
</svg>
